<!DOCTYPE html>
<html>
<head>
  <title>Video Test</title>
  <style>
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      max-width: 800px;
      margin: 20px auto;
      border: 3px solid blue;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <h1>Video Embed Test</h1>

  <h2>Test 1: Direct Embed</h2>
  <div class="video-wrapper">
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" style="border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>

  <h2>Test 2: JavaScript Set Embed</h2>
  <div class="video-wrapper">
    <iframe id="testFrame" title="YouTube video player" style="border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>

  <script>
    // Set video source via JavaScript like the main page does
    const testFrame = document.getElementById('testFrame');
    testFrame.src = 'https://www.youtube.com/embed/dQw4w9WgXcQ';
    console.log('Video src set to:', testFrame.src);
  </script>
</body>
</html>
